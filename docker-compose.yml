services:
  registry-node-1:
    build:
      context: .
      dockerfile: Dockerfile.registry
    container_name: registry-node-1
    command: ["-config", "/app/config/registry/node-1.yaml"]
    ports:
      - "50051:50051"
    networks:
      - registry-net

  registry-node-2:
    build:
      context: .
      dockerfile: Dockerfile.registry
    container_name: registry-node-2
    command: ["-config", "/app/config/registry/node-2.yaml"]
    ports:
      - "50052:50051"
    networks:
      - registry-net

  registry-node-3:
    build:
      context: .
      dockerfile: Dockerfile.registry
    container_name: registry-node-3
    command: ["-config", "/app/config/registry/node-3.yaml"]
    ports:
      - "50053:50051"
    networks:
      - registry-net

  registry-node-4:
    build:
      context: .
      dockerfile: Dockerfile.registry
    container_name: registry-node-4
    command: ["-config", "/app/config/registry/node-4.yaml"]
    ports:
      - "50054:50051"
    networks:
      - registry-net

  registry-node-5:
    build:
      context: .
      dockerfile: Dockerfile.registry
    container_name: registry-node-5
    command: ["-config", "/app/config/registry/node-5.yaml"]
    ports:
      - "50055:50051"
    networks:
      - registry-net

  service-cli:
    build:
      context: .
      dockerfile: Dockerfile.service-cli
    profiles:
      - tools
    networks:
      - registry-net

networks:
  registry-net:
    driver: bridge

