syntax = "proto3";

package registry.v1;

option go_package = "github.com/leonardomonnati2796/distributed-service-registry/pkg/api;apiv1";

enum HealthStatus {
  HEALTH_STATUS_UNSPECIFIED = 0;
  HEALTH_STATUS_SERVING = 1;
  HEALTH_STATUS_NOT_SERVING = 2;
  HEALTH_STATUS_DEGRADED = 3;
}

message ServiceMessage {
  reserved 8;

  string service_name = 1;
  string endpoint = 3;
  HealthStatus health_status = 5;
  uint64 lamport_clock = 9;
  int64 deletion_marker_expires_at_unix = 10;
  string lamport_node_id = 11;
}

message ServiceRegRequest {
  ServiceMessage record = 1;
}

message ServiceRegResponse {
  bool accepted = 1;
  string message = 2;
}

message ServiceDeregRequest {
  string service_name = 1;
}

message ServiceDeregResponse {
  bool accepted = 1;
  string message = 2;
}

message GetServiceRequest {
  string service_name = 1;
}

message GetServiceResponse {
  repeated ServiceMessage records = 1;
}

message ListServicesRequest {}

message ListServicesResponse {
  repeated ServiceMessage records = 1;
}

message NodeInfo {
  string node_id = 1;
  string grpc_address = 2;
  int64 updated_at_unix = 3;
}

message JoinNodeRequest {
  NodeInfo node = 1;
}

message JoinNodeResponse {
  repeated NodeInfo peers = 1;
  repeated ServiceMessage records = 2;
}

message GossipUpdRequest {
  string source_node_id = 1;
  repeated ServiceMessage records = 2;
  repeated NodeInfo peers = 3;
  int64 sent_at_unix = 4;
}

message GossipUpdResponse {
  bool accepted = 1;
  int64 received_at_unix = 2;
}

message AntyEntropyPullRequest {
  string source_node_id = 1;
  int64 since_unix = 2;
}

message AntyEntropyPullResponse {
  repeated ServiceMessage records = 1;
  repeated NodeInfo peers = 2;
}

service ServiceRegistry {
  rpc ServiceReg(ServiceRegRequest) returns (ServiceRegResponse);
  rpc ServiceDereg(ServiceDeregRequest) returns (ServiceDeregResponse);
  rpc GetService(GetServiceRequest) returns (GetServiceResponse);
  rpc ListServices(ListServicesRequest) returns (ListServicesResponse);
}

service RegPeer {
  rpc JoinNode(JoinNodeRequest) returns (JoinNodeResponse);
  rpc GossipUpd(GossipUpdRequest) returns (GossipUpdResponse);
  rpc AntyEntropyPull(AntyEntropyPullRequest) returns (AntyEntropyPullResponse);
}

