# Registry node 1: primo nodo del cluster Docker.
node:
  id: registry-node-1
  listen_address: 0.0.0.0:10001
  advertise_address: registry-node-1:10001

cluster:
  # Tutti i nodi condividono lo stesso elenco di peer iniziali.
  seed_peers:
    - registry-node-1:10001
    - registry-node-2:10001
    - registry-node-3:10001
    - registry-node-4:10001
    - registry-node-5:10001
  gossip_interval_seconds: 2
  gossip_start_delay_seconds: 0
  reconcile_interval_seconds: 5
  peer_timeout_: 8
  max_gossip_fanout: 2

