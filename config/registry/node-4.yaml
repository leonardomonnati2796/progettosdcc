# Registry node 4: quarto nodo del cluster Docker.
node:
  id: registry-node-4
  listen_address: 0.0.0.0:50051
  advertise_address: registry-node-4:50051

cluster:
  seed_peers:
    - registry-node-1:50051
    - registry-node-2:50051
    - registry-node-3:50051
    - registry-node-4:50051
    - registry-node-5:50051
  gossip_interval_seconds: 2
  gossip_start_delay_seconds: 0
  reconcile_interval_seconds: 5
  peer_timeout_seconds: 8
  max_gossip_fanout: 2